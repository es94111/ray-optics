name: Validate latest dependencies

on:
  push:
    branches: [chore/latest-deps-20260817]
    paths: [.github/workflows/latest-deps-20260817.yml]

permissions:
  contents: write

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/latest-deps-20260817
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Add current Babel core and upgrade all direct npm dependencies
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const v = cp.execFileSync('npm', ['view', '@babel/core', 'version'], {encoding: 'utf8'}).trim();
          pkg.optionalDependencies ||= {};
          pkg.optionalDependencies['@babel/core'] = `^${v}`;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npx --yes npm-check-updates@latest -u --target latest
          npm install
      - name: Confirm no further direct upgrade is available
        run: npx --yes npm-check-updates@latest --target latest --errorLevel 2
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit validated dependency update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/latest-deps-20260817.yml
          git add package.json package-lock.json
          git commit -m "chore(deps): upgrade Babel and all dependencies to latest stable"
          git push origin HEAD:chore/latest-deps-20260817
